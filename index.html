<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stem Machine</title>
<style>
/* tokens */
:root{
  --wood:#2a1d15;
  --wood-2:#3a2a1e;
  --panel:#4a4643;
  --panel-2:#35322f;
  --metal:#6b6560;
  --edge-hi:rgba(255,235,205,.16);
  --edge-lo:rgba(0,0,0,.55);
  --tile:#e8e2d8;
  --tile-ink:#1c1613;
  --tile-hover:#fff;
  --led:#ffab3d;
  --oxblood:#5a2320;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--wood);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--tile);
  overflow:hidden;
}

/* grain overlay */
body::after{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  opacity:.12;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  z-index:9;
}

/* ---------- hub ---------- */
#hub{
  position:fixed; inset:0;
  display:grid;
  grid-template-columns:78px 1fr 78px;
  background:
    radial-gradient(120% 80% at 20% 0%, rgba(255,220,180,.10), transparent 60%),
    linear-gradient(160deg,var(--wood-2),var(--wood) 60%, #1d140f);
}

/* fader strips */
.strip{
  position:relative;
  background:linear-gradient(90deg,var(--panel-2),var(--panel) 40%,var(--panel-2));
  border-left:1px solid var(--edge-hi);
  border-right:1px solid var(--edge-lo);
  box-shadow:inset 0 2px 0 var(--edge-hi), inset 0 -40px 60px rgba(0,0,0,.4);
}
.fader{
  position:absolute; left:50%; transform:translateX(-50%);
  width:6px; height:150px;
  background:linear-gradient(180deg,#151210,#241d19);
  border-radius:3px;
  box-shadow:inset 0 0 3px #000, 0 1px 0 var(--edge-hi);
}
.cap{
  position:absolute; left:-9px;
  width:24px; height:13px;
  background:linear-gradient(180deg,#8c8378,#4b453e);
  border-radius:2px;
  box-shadow:0 2px 3px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25);
}
.screw{
  position:absolute; width:8px; height:8px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#9a9189,#3b3733);
  box-shadow:0 1px 1px rgba(0,0,0,.7), inset 0 0 0 1px rgba(0,0,0,.3);
}

/* console face */
.face{
  position:relative;
  padding:26px 30px 30px;
  overflow-y:auto;
  background:
    linear-gradient(180deg, rgba(255,230,200,.06), transparent 30%),
    linear-gradient(180deg,#463f39,#2f2925);
  box-shadow:inset 0 3px 0 var(--edge-hi), inset 0 -3px 12px rgba(0,0,0,.6);
}

/* knob row */
.knobs{display:flex; gap:16px; justify-content:flex-end; margin-bottom:10px}
.knob{
  width:30px; height:30px; border-radius:50%;
  background:
    radial-gradient(circle at 34% 28%, #7e766d, #26221f 72%),
    var(--metal);
  box-shadow:0 3px 5px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.22);
  position:relative;
}
.knob::after{
  content:""; position:absolute;
  left:50%; top:4px; width:2px; height:11px;
  background:rgba(255,235,205,.65);
  transform-origin:50% 11px;
}
.knob:nth-child(1)::after{transform:translateX(-50%) rotate(-38deg)}
.knob:nth-child(2)::after{transform:translateX(-50%) rotate(12deg)}
.knob:nth-child(3)::after{transform:translateX(-50%) rotate(-64deg)}
.knob:nth-child(4)::after{transform:translateX(-50%) rotate(41deg)}

/* record spines */
.spines{display:flex; gap:3px; height:8px; margin:0 0 22px}
.spines i{flex:1; border-radius:1px; opacity:.5}

/* link tiles */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:16px;
}
a.tile{
  display:flex; align-items:center; gap:12px;
  padding:20px 18px;
  background:var(--tile);
  color:var(--tile-ink);
  text-decoration:none;
  border:none; border-radius:4px;
  font-size:19px; font-weight:600; line-height:1.25;
  box-shadow:0 3px 0 rgba(0,0,0,.45);
  cursor:pointer;
  transition:transform .08s, background .12s;
}
a.tile:hover,a.tile:focus{background:var(--tile-hover); transform:translateY(-2px)}
a.tile:active{transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.45)}
a.tile svg{flex:none; stroke:var(--tile-ink); stroke-width:1.6; fill:none}

/* leds */
.leds{position:absolute; left:30px; bottom:14px; display:flex; gap:10px}
.leds span{
  width:7px; height:7px; border-radius:50%;
  background:var(--led);
  box-shadow:0 0 8px var(--led), 0 0 2px #fff inset;
}
.leds span:nth-child(2){background:var(--oxblood); box-shadow:0 0 7px var(--oxblood)}

/* ---------- viewer ---------- */
#viewer{position:fixed; inset:0; display:none; background:#000; z-index:20}
#viewer iframe{width:100%; height:100%; border:0; display:block}
#home{
  position:fixed; top:14px; right:14px; z-index:30;
  width:52px; height:52px; border-radius:6px;
  border:2px solid #1c1613;
  background:var(--tile);
  display:none; place-items:center;
  cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.6);
}
#home:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.6)}
#home svg{stroke:#1c1613; stroke-width:2; fill:none}

@media (max-width:720px){
  #hub{grid-template-columns:34px 1fr 34px}
  .cap,.knobs{display:none}
}
</style>
</head>
<body>

<!-- hub -->
<div id="hub">
  <div class="strip" id="stripL"></div>

  <div class="face">
    <div class="knobs"><i class="knob"></i><i class="knob"></i><i class="knob"></i><i class="knob"></i></div>
    <div class="spines" id="spines"></div>

    <div class="grid" id="grid"></div>

    <div class="leds"><span></span><span></span><span></span></div>
  </div>

  <div class="strip" id="stripR"></div>
</div>

<!-- viewer -->
<div id="viewer"><iframe id="frame" title="page"></iframe></div>
<button id="home" aria-label="Home">
  <svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M6 10v9h12v-9"/></svg>
</button>

<script>
/* ================================================================
   ██  MANIFEST — EDIT THIS. NOTHING ELSE.  ██
   ================================================================

   One line per page. Files live in the pages/ folder.

     file  — filename inside pages/
     label — what the tile says
     icon  — pick one from ICONS below, or leave it out

   Add a page   : drop the .html in pages/, add a line here.
   Remove a page: delete its line here. The file can stay.
   Reorder      : move the lines. Tiles follow this order.

   ================================================================ */

const PAGES = [
  { file: "stem-player.html", label: "Stem Player", icon: "faders" },
  { file: "6-elements/6elements.html",   label: "6 Elements",  icon: "grid" },
  {file: "solfege-tracker/index.html", label: "Solfege Tracker", icon: "grid"},
  { file: "synth-lab/index.html", label: "Synth Lab", icon: "wave" },
];


/* ---- ICONS — add your own; 24x24 viewBox path data ---- */
const ICONS = {
  faders:  "M4 8v8M8 5v14M12 9v6M16 4v16M20 10v4",
  wave:    "M2 12c2-6 4 6 6 0s4 6 6 0 4 6 6 0",
  note:    "M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm11-2a3 3 0 11-6 0 3 3 0 016 0z",
  disc:    "M12 3a9 9 0 100 18 9 9 0 000-18zm0 7a2 2 0 100 4 2 2 0 000-4z",
  grid:    "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
  book:    "M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2zM19 17H6",
  play:    "M6 4l14 8-14 8z",
  default: "M5 4h14v16H5zM8 8h8M8 12h8M8 16h5",
};

/* ================================================================
   below here is machinery — you shouldn't need to touch it
   ================================================================ */

// build the tiles
document.getElementById("grid").innerHTML = PAGES.map(function (p) {
  var d = ICONS[p.icon] || ICONS.default;
  return '<a class="tile" href="pages/' + p.file + '">' +
         '<svg width="26" height="26" viewBox="0 0 24 24"><path d="' + d + '"/></svg>' +
         p.label + '</a>';
}).join("");

// decor: faders
var heights=[.22,.61,.38,.74,.45,.55,.30,.68];
['stripL','stripR'].forEach(function(id,s){
  var el=document.getElementById(id),h='';
  for(var i=0;i<4;i++){
    var top=40+i*180, pos=heights[s*4+i];
    h+='<div class="fader" style="top:'+top+'px"><div class="cap" style="top:'+(pos*137)+'px"></div></div>';
    h+='<div class="screw" style="top:'+(top-18)+'px;left:12px"></div>';
    h+='<div class="screw" style="top:'+(top-18)+'px;right:12px"></div>';
  }
  el.innerHTML=h;
});

// decor: record spines
var tones=['#5a2320','#7a4a22','#2f3c2e','#1f1a17','#6b3a1e','#3a2a1e','#5c5248'],sp='';
for(var i=0;i<46;i++) sp+='<i style="background:'+tones[i%tones.length]+'"></i>';
document.getElementById('spines').innerHTML=sp;

// nav: open in frame
var hub=document.getElementById('hub'),
    viewer=document.getElementById('viewer'),
    frame=document.getElementById('frame'),
    home=document.getElementById('home');

document.querySelectorAll('a.tile').forEach(function(a){
  a.addEventListener('click',function(e){
    e.preventDefault();
    open_page(a.getAttribute('href'));
  });
});

function open_page(src){
  frame.src=src;
  viewer.style.display='block';
  home.style.display='grid';
  history.pushState({open:1},'','#'+src);
}
function go_home(){
  viewer.style.display='none';
  home.style.display='none';
  frame.src='about:blank';
}
home.addEventListener('click',function(){history.back()});
window.addEventListener('popstate',go_home);

// deep link on load
if(location.hash.length>1) open_page(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
